<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Ears -->
  <circle cx="50" cy="55" r="28" fill="#1f2937"/>
  <circle cx="150" cy="55" r="28" fill="#1f2937"/>
  <!-- Head -->
  <circle cx="100" cy="110" r="70" fill="#ffffff" stroke="#e5e7eb" stroke-width="4"/>
  <!-- Eye Patches -->
  <ellipse cx="72" cy="100" rx="20" ry="25" fill="#1f2937" transform="rotate(-15 72 100)"/>
  <ellipse cx="128" cy="100" rx="20" ry="25" fill="#1f2937" transform="rotate(15 128 100)"/>
  <!-- Eyes -->
  <circle cx="74" cy="98" r="8" fill="#ffffff"/>
  <circle cx="126" cy="98" r="8" fill="#ffffff"/>
  <circle cx="76" cy="97" r="4" fill="#000000"/>
  <circle cx="124" cy="97" r="4" fill="#000000"/>
  <!-- Cheeks -->
  <circle cx="50" cy="130" r="10" fill="#f472b6" opacity="0.5"/>
  <circle cx="150" cy="130" r="10" fill="#f472b6" opacity="0.5"/>
  <!-- Nose & Mouth -->
  <ellipse cx="100" cy="125" rx="8" ry="6" fill="#1f2937"/>
  <path d="M 92 135 Q 100 148 108 135" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
</svg>
